name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: DvplModHelper
    
    - name: Build with Gradle
      run: ./gradlew assembleRelease
      working-directory: DvplModHelper
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: DvplModHelper/app/build/outputs/apk/release/*.apk
    
    - name: Run tests
      run: ./gradlew test
      working-directory: DvplModHelper
